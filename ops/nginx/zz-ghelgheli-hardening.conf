# سخت‌سازی/سرعتِ GhelGheli (۲۰۲۶-۰۹-۲۲) — سطحِ http (conf.d)، روی همهٔ سایت‌ها.
# این نسخه در مخزن است؛ نسخهٔ فعال: /etc/nginx/conf.d/zz-ghelgheli-hardening.conf
# brotli: ماژولش از قبل load شده بود ولی هیچ‌جا روشن نبود — با gzip یکی است از
# نظرِ امکانات، فقط ~۱۵-۲۰٪ کوچک‌تر روی سیم (JS/CSS). سطحِ ۵ = تعادلِ CPU/حجم.
brotli on;
brotli_comp_level 5;
brotli_types text/css application/javascript application/json image/svg+xml text/plain application/xml text/xml application/manifest+json;
# هدرِ Server بدونِ شمارهٔ نسخه (کمتر شدنِ سطحِ اطلاعات برای اسکنرها).
server_tokens off;
