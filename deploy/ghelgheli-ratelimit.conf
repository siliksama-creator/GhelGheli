# ═══════════════════════════════════════════════════════════════════════════
#  سقفِ راحتِ عمومیِ درخواست — سطحِ http
# ═══════════════════════════════════════════════════════════════════════════
#
# خواستهٔ مالک (۲۶ شهریور):
#
#   «الف) سقفِ راحتِ عمومی در nginx (مثلاً ۳۰ درخواست در ثانیه از هر آی‌پی) →
#    جلوی موجِ ربات‌ها را می‌گیرد، برای کاربرِ واقعی بی‌ضرر.»
#
# ── چرا ۳۰ در ثانیه ───────────────────────────────────────────────────────
#
# کاربرِ عادی (وب یا اپ) در حداکثرِ فعالیت شاید ۲ تا ۵ درخواست در ثانیه
# بفرستد؛ آن هم در لحظهٔ باز شدنِ یک صفحه. ۳۰ یعنی ۶ تا ۱۵ برابرِ سقفِ
# واقعیِ مصرف — پس هیچ کاربری آن را نمی‌بیند، ولی موجِ رباتی که هزاران
# درخواست در ثانیه می‌فرستد همان لحظه به دیوار می‌خورد.
#
# ── چرا burst=۹۰ و nodelay (در اسنیپتِ location) ──────────────────────────
#
# بدونِ burst، حتی یک کاربرِ سالم هم می‌توانست با باز کردنِ یک صفحه (که ۱۵ تا
# ۲۵ درخواستِ هم‌زمان دارد) پشتِ سقف بماند. burst اجازهٔ «موجِ کوتاه» می‌دهد
# و nodelay یعنی آن موج صف نمی‌کشد و کند نمی‌شود.
#
# ── چه چیزی عمداً سقف ندارد ───────────────────────────────────────────────
#
#   • `/socket.io/` — سوکتِ بازی؛ در حالتِ polling خودش ~۱ درخواست در ثانیه
#     برای هر کاربر می‌زند و سقف‌گذاشتن روی آن یعنی قطعِ بازیِ کاربر.
#   • `/assets/` و فایل‌های ایستا (تصویر، فونت، صدا) — ارزان‌اند و سقف‌گذاشتن
#     روی آن‌ها فقط بارگذاریِ صفحه را برای کاربرِ پشتِ CGNAT کند می‌کند.
#
# ⚠️ این سقف روی **آی‌پی** است، پس با CGNAT (اپراتورهای موبایل که صدها کاربر
#    یک آی‌پی دارند) باید دستِ‌ودل‌باز باشد — ۳۰/ثانیه + ۹۰ موجِ کوتاه یعنی
#    یک شبکهٔ بزرگ هم می‌تواند هم‌زمان کار کند. سقف‌های سختِ «هر کاربر» جای
#    دیگری و روی شمارهٔ خودِ کاربر است (backend: otpMobileLimiter و …).
#
# نصب: `scripts/deploy.sh` این فایل را به /etc/nginx/snippets/ می‌نویسد؛
#       در کانفیگِ سایت با `include` بارگذاری می‌شود.

# ۱۰ مگابایت ≈ ۱۶۰ هزار آی‌پیِ هم‌زمان؛ برای این سرور بسیار بیشتر از نیاز.
limit_req_zone $binary_remote_addr zone=ghelgheli_public:10m rate=30r/s;

# ۴۲۹ «درخواستِ زیاد» است، نه ۵۰۳ «سرور خراب». کلاینت‌ها (و خودِ اپ) این را
# «کمی بعد دوباره تلاش کن» می‌فهمند، نه «سرویس از کار افتاده».
limit_req_status 429;
