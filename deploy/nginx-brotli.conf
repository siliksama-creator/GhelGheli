# B3 — فشرده‌سازی Brotli برای پرتال‌های وب (ادمین + کاربر).
#
# محل روی سرور: /etc/nginx/conf.d/10-brotli.conf
# (در سطح http لود می‌شود و برای همهٔ server blockها اعمال می‌گردد.)
#
# پیش‌نیاز (یک‌بار روی سرور):
#   apt-get update
#   apt-get install -y libnginx-mod-http-brotli-filter
#   # پکیج، ماژول را در /etc/nginx/modules-enabled/50-mod-http-brotli-filter.conf
#   # با دستور load_module فعال می‌کند؛ نیازی به تنظیم اضافه نیست.
#
# سپس این فایل را در conf.d بگذار، `nginx -t` بگیر و reload کن.
#
# نکته‌ها:
# - روی Ubuntu 24.04 / nginx 1.24 پکیج رسمی `libnginx-mod-http-brotli-filter`
#   موجود است. ماژول دستور `brotli_vary` ندارد (در این نسخه حذف شده) — اضافه‌اش
#   نکن وگرنه nginx -t با "unknown directive" می‌شکند.
# - سطح ۵ تعادل فشردگی/CPU است؛ gzip به‌عنوان fallback برای مرورگرهای قدیمی
#   روشن می‌ماند. تصویر/مدل (onnx) فشرده نمی‌شوند چون فایده ندارند.
# - اگر روزی سرور تازه ساخته شد، این فایل بخشی از restore است.

brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types
  text/plain
  text/css
  text/xml
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/xml+rss
  image/svg+xml
  application/wasm;
