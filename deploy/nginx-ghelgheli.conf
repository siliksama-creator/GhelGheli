server {
  server_name api.ghelghelishop.ir;
  client_max_body_size 20M;
  location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.ghelghelishop.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.ghelghelishop.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
  server_name admin.ghelghelishop.ir;
  include /etc/nginx/snippets/ghelgheli-security.conf;
  root /var/www/GhelGheli/admin/dist;
  index index.html;
  # فایل‌های hashدار Vite هرگز با همان نام عوض نمی‌شوند.
  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  # دارایی‌های ثابت نام‌دار؛ revalidate روزانه لازم نیست.
  location ~* \.(?:woff2|webp|png|jpe?g|svg|mp3)$ {
    try_files $uri =404;
    expires 30d;
  }
  # index.html نقطهٔ ورود است و نامش هرگز عوض نمی‌شود؛ اگر مرورگر آن را
  # کش کند تا ابد به باندلِ hashدارِ قدیمی اشاره می‌کند و کاربر هیچ‌وقت
  # کدِ جدید را نمی‌بیند — دقیقاً همان دلیلی که صندوقِ کارت برای کاربرانِ
  # قدیمی در فروشگاه ظاهر نشد. باید هر بار revalidate شود.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }
  # سرویس‌ورکر هم نباید کش شود، وگرنه نسخهٔ کهنه‌اش زنده می‌ماند.
  location = /image-cache-sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri /index.html;
  }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.ghelghelishop.ir/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.ghelghelishop.ir/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
