# ═══════════════════════════════════════════════════════════════════════════
#  سروِ فایلِ نصبی / به‌روزرسانیِ اپ (APK) از خودِ سرور
# ═══════════════════════════════════════════════════════════════════════════
#
# ── چرا این فایل وجود دارد (تصمیمِ مالک، ۱ مهر ۱۴۰۵) ─────────────────────
#
# «کافه‌بازار را نمی‌خواهیم بدهیم؛ فقط زرین‌پال.» با کنارگذاشتنِ انتشار در
# بازار، دکمهٔ «به‌روزرسانی» اپ و وب به صفحهٔ نصبِ یک بستهٔ **ناموجود**
# اشاره می‌کرد (`ops_limits.bazaarApiBase` + `app.bazaarPackage`). حالا خودِ
# سرور فایل را می‌دهد:
#
#     https://api.ghelghelishop.com/app/ghelgheli-latest.apk     (اپ)
#     https://user.ghelghelishop.com/app/ghelgheli-latest.apk    (وب، هم‌مبدأ)
#
# ── فایل‌ها کجا هستند ────────────────────────────────────────────────────
#
# /var/www/ghelgheli-apk — عمداً **بیرونِ** APP_DIR: دیپلوی داخلِ APP_DIR را
# با `git clean -fd` تمیز می‌کند و فایلِ ~۶۰ مگابایتیِ اپ نباید قربانیِ آن
# شود. نصبِ همین اسنیپت + ساختِ پوشه + درجِ include در vhostها کارِ
# `deploy.sh` است (idempotent؛ اگر بود، کاری نمی‌کند).
#
# ── دو location ──────────────────────────────────────────────────────────
#
#   ۱) /app/                    → سروِ فایل (alias روی پوشهٔ بالا)
#   ۲) = /api/admin/apk/upload  → اجازهٔ بدنهٔ ۲۵۰ مگابایتی برای آپلودِ پنل
#
# بدونِ (۲)، آپلودِ APK در **خودِ nginx** با ۴۱۳ می‌مرد (سقفِ عمومیِ
# vhostها ۲۰ مگابایت است) و کسی گمانش را نمی‌برد که تقصیرِ بک‌اند نیست.

# ── ۱) سروِ فایل ─────────────────────────────────────────────────────────
location ^~ /app/ {
  alias /var/www/ghelgheli-apk/;
  autoindex off;

  # APK در اصل یک zip است؛ بدونِ این، بعضی مرورگرها دنبالِ بازکردنش در تب
  # می‌روند به‌جای ذخیره‌کردن.
  default_type application/vnd.android.package-archive;
  add_header Content-Disposition "attachment" always;
  add_header X-Content-Type-Options "nosniff" always;

  # `...-latest.apk` باید همیشه تازه بررسی شود؛ فایلِ نسخه‌دار نامش ثابت است
  # و مرورگر خودش می‌تواند کش کند، ولی «آخرین نسخه» نباید کش شود وگرنه
  # کاربر نسخهٔ قبلی را دانلود می‌کند.
  add_header Cache-Control "no-cache, must-revalidate" always;

  # سقفِ نرخِ ۳۰ درخواست/ثانیه عمداً این‌جا نیست: یک دانلودِ معمولی چند
  # درخواستِ Range می‌فرستد و بستنِ راهِ کاربرِ واقعی بدتر از تحملِ چند
  # دانلودِ هم‌زمان است.
}

# ── ۲) آپلودِ APK از پنل ادمین ───────────────────────────────────────────
location = /api/admin/apk/upload {
  client_max_body_size 250m;
  proxy_request_buffering off;   # کلِ فایل اول در دیسکِ nginx ننشیند
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_pass http://ghelgheli_http;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
