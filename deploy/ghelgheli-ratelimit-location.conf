# ═══════════════════════════════════════════════════════════════════════════
#  خطِ سقفِ درخواست — داخلِ locationها include می‌شود
# ═══════════════════════════════════════════════════════════════════════════
#
# این خط جدا از فایلِ zone است چون `limit_req_zone` فقط در سطحِ http مجاز
# است و `limit_req` در سطحِ location. تعریفِ zone در
# `/etc/nginx/snippets/ghelgheli-ratelimit.conf` و بارگذاری‌اش در بالای
# کانفیگِ سایت انجام می‌شود.
#
# burst=۹۰: تا ۹۰ درخواستِ مازادِ کوتاه بدونِ خطا رد می‌شود (یک صفحهٔ وب
#           هم‌زمان تا ~۲۵ درخواست می‌زند؛ بازی و چت هم چندتایی). بیش از آن
#           یعنی واقعاً ربات.
# nodelay: آن موج صف نمی‌کشد و کند نمی‌شود — تأخیرِ اضافه برای کاربرِ سالم
#          دقیقاً چیزی است که این سقف نباید بسازد.
limit_req zone=ghelgheli_public burst=90 nodelay;
