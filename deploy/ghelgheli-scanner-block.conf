# ═══════════════════════════════════════════════════════════════════════════
#  بستنِ راهِ اسکنرها روی سایت‌های ایستا (وبِ کاربر + پنل ادمین)
# ═══════════════════════════════════════════════════════════════════════════
#
# خواستهٔ مالک (۲۹ شهریور، بعد از هشدارِ «۲۶۳ درخواست از یک آی‌پی»):
#   «این دوتا رو چک کن ببین اگه واقعاً راست می‌گن، دلیلش چیه، فیکسش کن.»
#
# ── آن هشدار چه بود ────────────────────────────────────────────────────────
#
# منبعش یک **اسکنرِ خودکارِ آسیب‌پذیری** بود، نه حملهٔ هدفمند. فهرستِ
# درخواست‌هایش همه از یک جنس بود:
#     /.git/config        /wp-admin/phpinfo.php     /yii/.env
#     /zend/.env          /wordpress/.env            /worker/.env
#     /phpinfo.php        /wp-json/gravitysmtp/...   (@ ۲۵۸ پاسخِ ۲۰۰!)
#
# یعنی دنبالِ «لو رفتنِ فایل‌های WordPress/PHP» می‌گشت — الگویی که هر روز
# روی میلیون‌ها دامنه اجرا می‌شود و به این که اپ عمومی شده یا نه کاری ندارد.
#
# ── چرا این یک مشکلِ واقعی بود (هرچند چیزی لو نرفته بود) ───────────────────
#
# چون هر دو سایت SPA اند، قاعدهٔ `try_files $uri /index.html` **همهٔ** آن
# آدرس‌های بی‌معنی را با کدِ **۲۰۰** و صفحهٔ اپ جواب می‌داد. نتیجه:
#   ۱. اسکنر «۲۰۰» می‌دید و این دامنه را «دارایِ محتوا» ثبت می‌کرد و
#      دورِ بعد برمی‌گشت (۲۵۸ از ۲۶۳ درخواستِ آن دقیقه ۲۰۰ بود).
#   ۲. خرابیِ واقعیِ لینک‌ها هم زیرِ همان ۲۰۰ها گم می‌شد (هیچ ۴۰۴ی دیده نمی‌شد).
#   ۳. خطرِ آینده: اگر روزی فایلی مثلِ `.env` یا دامپِ SQL داخلِ ریشهٔ وب
#      بیفتد، همین قاعده آن را با ۲۰۰ عمومی می‌کرد.
#
# ── کاری که می‌کند ────────────────────────────────────────────────────────
#
# هر مسیرِ نقطه‌دار (به‌جز `/.well-known/` که برای گواهی TLS لازم است) و هر
# نشانهٔ اسکنر/CMS با **۴۰۴** جواب می‌گیرد. ۴۰۴ عمداً انتخاب شده: ۴۰۳ می‌گوید
# «اینجا چیزی هست ولی نبین»، ۴۰۴ می‌گوید «اینجا چیزی نیست» و اسکنر رد می‌شود.
#
# ⚠️ هیچ درخواستِ سالمِ اپ به این بلوک‌ها نمی‌خورد: مسیرهای SPA (`/club`,
# `/wallet`, `/shop` …) و دارایی‌های hashدار (`/assets/...`) سرِ جای خودشان
# اند؛ `location ^~ /assets/` هم که در کانفیگِ سایت هست بر همهٔ regexهای این
# فایل اولویت دارد.
#
# نصب: `scripts/deploy.sh` این فایل را در `/etc/nginx/snippets/` می‌گذارد و
# یک include را به هر server-blockِ ایستا اضافه می‌کند:
#     include /etc/nginx/snippets/ghelgheli-scanner-block.conf;

# ۱) چالشِ ACME (Certbot) باید در دسترس بماند.
#    `^~` = پیشوند، و بر regexها اولویت دارد؛ پس بلوکِ نقطه‌دار زیر آن را
#    نمی‌بندد. (Certbot هم هنگامِ تازه‌سازی، location دقیقِ خودش را موقتاً
#    اضافه می‌کند که اولویتِ بالاتری از این پیشوند دارد.)
location ^~ /.well-known/ {
  try_files $uri =404;
}

# ۲) هیچ مسیرِ نقطه‌داری سرو نمی‌شود: /.git، /.env، /.svn، /.htaccess، /.DS_Store
location ~ /\. {
  return 404;
}

# ۳) نشانه‌های اسکنر/CMS (فهرستِ کلاسیکِ اسکن‌ها)
location ~* ^/(wp-|wordpress|xmlrpc\.php|phpmyadmin|pma|adminer|myadmin|vendor/|composer\.(json|lock)|yii/|zend/|laravel|thinkphp|worker/|backups?/|install/|setup/|debug/) {
  return 404;
}

# ۴) هیچ فایلِ PHP روی این سرور وجود ندارد؛ اگر کسی خواست، ۴۰۴.
location ~* \.php$ {
  return 404;
}

# ۵) پسوندهای «فایلِ پشتیبان/موقت» که هرگز عمومی نیستند.
#    عمداً `zip/tar/gz` نیامده‌اند: ممکن است روزی خروجیِ قابل‌دانلودِ اپ
#    (مثلِ خروجیِ گزارش) از همین‌ها باشد و بستنشان یک قابلیت را بی‌دلیل می‌کشد.
location ~* \.(sql|bak|old|orig|save|swp|log)$ {
  return 404;
}
