<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060d18" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>پنل مدیریت قلقلی</title>
  <!--
    B4: API روی زیردامنهٔ جداست؛ گرم‌کردنِ اتصال یک رفت‌وبرگشت DNS+TLS را از
    اولین درخواستِ بعد از ورود حذف می‌کند (مخصوصاً روی موبایل با RTT بالا).
  -->
  <link rel="preconnect" href="https://api.ghelghelishop.ir" crossorigin />
  <link rel="dns-prefetch" href="https://api.ghelghelishop.ir" />
  <!--
    B5: فقط دو وزنی که قبل از هر تعاملی روی صفحه‌اند (بدنه Regular، تیتر/دکمه
    Bold) را preload می‌کنیم تا اولین paint با فونتِ fallback نپرد و reflow
    نگیرد؛ بقیهٔ وزن‌ها عمداً preload نمی‌شوند تا ~۱۰۰KB هدر نرود.
  -->
  <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
