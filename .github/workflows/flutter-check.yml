name: Flutter Check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs on every change to the app: analyze + unit tests, no packaging.
#
# This is what now guards the mobile code on each push — "Build APK" was
# switched to manual so no APK is produced unless someone asks for one, and
# without this the Flutter code would go unverified between releases.
on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: rm -f test/widget_test.dart
      - name: Analyze
        # قبلاً عمداً شل بود (--no-fatal-warnings) و در نتیجه هشت ایراد
        # (دو هشدارِ `!` زائد و شش constِ جاافتاده) بی‌صدا انباشته شدند؛
        # هر هشت در ۸ مهر تعمیر شدند. از حالا هشدار = CI قرمز. infoها
        # (سبکِ سلیقه‌ای مثل prefer_const) هنوز کشنده نیستند تا نویزِ
        # بی‌ضرر جریان را قفل نکند.
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/flutter-test.log
      # ⚠️ چرا این گام وجود دارد: لاگِ job در این مخزن از بیرون خوانده
      # نمی‌شود — `GET /actions/jobs/<id>/logs` بی‌توکن 403 می‌دهد («Must
      # have admin rights»). نتیجه این بود که بعد از هر شکستِ تست باید
      # حدس می‌زدیم کدام تست افتاده. این گام خط‌های خطا را به annotation
      # تبدیل می‌کند و آن‌ها از طریق `commits/<sha>/check-runs/.../annotations`
      # بی‌توکن خوانده می‌شوند.
      - name: Failure digest (annotations)
        if: failure()
        run: |
          grep -E "\[E\]|Expected:|Actual:|Which:|Failed to load" /tmp/flutter-test.log \
            | head -n 25 | while IFS= read -r line; do
                echo "::error title=flutter-test::$line"
              done || true
