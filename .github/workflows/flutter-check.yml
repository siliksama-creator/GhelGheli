name: Flutter Check

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs on every change to the app: analyze + unit tests, no packaging.
#
# This is what now guards the mobile code on each push — "Build APK" was
# switched to manual so no APK is produced unless someone asks for one, and
# without this the Flutter code would go unverified between releases.
on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: rm -f test/widget_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Widget tests
        run: flutter test
