name: Flutter Check
on:
  workflow_dispatch:
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: rm -f test/widget_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Widget tests
        run: flutter test
