name: Build APK

# MANUAL ONLY.
#
# This used to run on every push to main, which meant an APK was produced for
# work-in-progress commits nobody had asked to ship. Compilation is still
# verified on every change by the "Flutter Check" workflow (analyze + tests,
# no packaging), so nothing is lost by not building here automatically.
#
# Run it from Actions → Build APK → Run workflow when a build is actually
# wanted.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        # NOTE: do NOT pin an old Flutter here. The app uses modern APIs
        # (Color.withValues, CardThemeData, DialogThemeData,
        # FadeForwardsPageTransitionsBuilder, DropdownButtonFormField
        # .initialValue) that only exist on Flutter >= 3.32. Pinning 3.24.0
        # is what made every "Build APK" run fail to compile.
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Platform Folders
        run: cd mobile && flutter create --platforms=android .

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            mkdir -p mobile/android/app
            echo "$GOOGLE_SERVICES_B64" | base64 -d > mobile/android/app/google-services.json
            python3 -m json.tool mobile/android/app/google-services.json >/dev/null
            echo "Firebase Android config restored"
          else
            echo "::warning::FIREBASE_GOOGLE_SERVICES_JSON_BASE64 تنظیم نشده؛ Push در APK غیرفعال خواهد بود"
          fi

      - name: Ensure Firebase compatible minSdk
        run: |
          cd mobile
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      # پلاگینِ onnxruntime (مدلِ بردارِ تشخیص کارت، فاز ۲) و وابسته‌های androidx
      # چند پلاگین دیگر علیه android-34+ کامپایل می‌شوند؛ `flutter create`
      # پیش‌فرضِ کمتری می‌گذارد و checkReleaseAarMetadata می‌شکند. این پچ
      # compileSdk را برای **همهٔ ماژول‌ها** (نه فقط app) بالا می‌برد. مثل
      # minSdk، چون android/ در هر اجرا بازساخته می‌شود این اصلاح همینجاست.
      - name: Bump compileSdk for onnxruntime
        run: cd mobile && bash tool/patch_compile_sdk.sh

      # `flutter create` only puts INTERNET in the DEBUG manifest; the
      # release manifest it generates has NO permissions, so the shipped APK
      # had no network access at all. android/ is gitignored and regenerated
      # here, so the fix must run in CI. See the script for details.
      - name: Patch release AndroidManifest
        run: cd mobile && bash tool/patch_android.sh

      # قفل‌کردنِ معماری‌ها روی arm64+arm32 (بدونِ x86_64 که فقط شبیه‌ساز
      # است). بدونِ این، APKِ یونیورسال کتابخانه‌های بومیِ پلاگین‌ها را برای
      # هر سه معماری داخلِ فایل می‌گذارد.
      - name: Lock APK ABIs to real phone architectures
        run: cd mobile && bash tool/patch_abi.sh

      # ── RELEASE SIGNING ──────────────────────────────────────────────────
      #
      # WHY THIS MATTERS MORE THAN IT LOOKS. Without a signing config,
      # `flutter build apk --release` silently falls back to the DEBUG key —
      # the build succeeds and the APK installs, so nothing looks wrong. But:
      #
      #   * Cafe Bazaar rejects debug-signed uploads outright, and
      #   * Android identifies an app by its SIGNATURE, not its package name.
      #     Every debug-signed build is signed with a throwaway key generated
      #     on that machine, so two builds cannot even update each other.
      #
      # That means every day shipped without this step creates installs that
      # can never be upgraded — the damage is retroactive and unfixable.
      #
      # The keystore lives in repository secrets, never in git. Losing it
      # means no existing install can ever be updated again, so it is also
      # kept offline outside this repo.
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "Refusing to build: an unsigned/debug-signed release APK"
            echo "cannot be published and can never be updated."
            exit 1
          fi
          mkdir -p mobile/android/app
          echo "$KEYSTORE_B64" | base64 -d > mobile/android/app/release.jks
          # Fail loudly if the secret decoded to something that is not a
          # keystore, rather than producing a mystery Gradle error later.
          keytool -list -keystore mobile/android/app/release.jks \
            -storepass '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' >/dev/null
          echo "keystore restored and verified"

      - name: Write signing config
        run: |
          cd mobile
          # key.properties is read by build.gradle below. It is written at
          # build time and never committed.
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF
          bash tool/patch_signing.sh

      # ── R8 / کوچک‌سازی کد ─────────────────────────────────────────────────
      #
      # فلاتر R8 را پیش‌فرض خاموش می‌گذارد. روشن کردنش هم APK را کوچک
      # می‌کند و هم — مهم‌تر برای گوشی‌های کم‌رم — جدول‌های DEX را که
      # اندروید برای کل عمرِ پروسه رزیدنت نگه می‌دارد.
      #
      # android/ در هر اجرا از نو ساخته می‌شود، پس مثل مجوزها و امضا،
      # این هم باید در CI اعمال شود. قوانین keep داخل خود اسکریپت‌اند.
      - name: Enable R8 code shrinking
        run: cd mobile && bash tool/patch_shrink.sh

      - name: Install dependencies
        run: cd mobile && flutter pub get

      # WITHOUT THIS THE APK SHIPPED FLUTTER'S DEFAULT BLUE ICON.
      #
      # `flutter create` regenerates android/ on every CI run (the directory is
      # gitignored), which wipes any icons committed to the repo. pubspec has a
      # flutter_launcher_icons block but nothing ever executed it, so the
      # launcher icons were simply absent — verified by unzipping the built
      # APK: zero mipmap entries.
      - name: Generate launcher icons
        run: cd mobile && dart run flutter_launcher_icons

      # Same reasoning for the splash screen.
      - name: Generate splash screen
        run: cd mobile && dart run flutter_native_splash:create || true

      # `flutter create` drops a placeholder widget_test.dart that references
      # a MyApp class this project doesn't have, so it fails to compile.
      # Delete ONLY that file — the real tests under mobile/test/ must run.
      - name: Remove generated default widget test
        run: rm -f mobile/test/widget_test.dart

      - name: Run widget tests
        run: cd mobile && flutter test

      - name: Analyze
        # Informational: `flutter analyze` results depend on the exact stable
        # Flutter version the runner picks up, so a version-specific lint must
        # never block shipping an APK that actually compiles. Real compile
        # errors still fail the job at the build step below.
        continue-on-error: true
        run: cd mobile && flutter analyze --no-fatal-infos

      - name: Build APK
        run: |
          cd mobile
          # ══════════════════════════════════════════════════════════════
          # universal APK — یک فایل برای همهٔ گوشی‌ها (تصمیمِ مالک، ۲ مهر ۱۴۰۵)
          # ══════════════════════════════════════════════════════════════
          #
          # تا این دور، بیلد «برای هر معماری یک فایل» می‌ساخت (`--split-per-abi`)
          # و هر فایل ~۲۰ مگابایت سبک‌تر بود. ولی از وقتی انتشار از **پنل خودمان**
          # انجام می‌شود، آن تصمیم یک هزینهٔ پنهان پیدا کرد: ما فقط **یک لینک**
          # داریم (`/app/ghelgheli-latest.apk`)؛ کاربرِ گوشیِ ۳۲ بیتی اگر فایلِ
          # arm64 را می‌گرفت، اندروید نصب را رد می‌کرد («برنامه با دستگاه شما
          # سازگار نیست») و ادمین از پنل نمی‌فهمید چرا.
          #
          # حالا یک APKِ یونیورسال ساخته می‌شود که هر دو معماری را دارد:
          #
          #     lib/arm64-v8a     گوشی‌های امروزی
          #     lib/armeabi-v7a   گوشی‌های قدیمیِ ۳۲ بیتی
          #
          # ⚠️ `--target-platform` عمداً مانده: یونیورسالِ پیش‌فرضِ فلاتر
          #    x86_64 را هم داخل فایل می‌گذارد (~۲۰ مگابایت) که فقط برای
          #    شبیه‌ساز است و روی هیچ گوشیِ واقعی اجرا نمی‌شود. با نگه‌داشتنِ
          #    فهرستِ معماری‌ها همان یک فایلِ همه‌کاره ساخته می‌شود، بی آن حجمِ مرده.
          #
          # هزینه: فایلِ دانلودی سنگین‌تر می‌شود — اندازه‌گیریِ واقعیِ بیلدِ
          # ۲ مهر: ۸۹٬۹۹۴٬۳۲۷ بایت (≈۸۵.۸ مبی‌بایت) در برابر ۵۸ مگابایتِ
          # نسخهٔ تک‌معماری. بیشترین سهم از `libonnxruntime.so` است
          # (۱۴ مگابایت arm64 + ۹.۸ مگابایت arm32) که برای مدلِ بردارِ
          # تشخیص کارت لازم است و قابلِ حذف نیست.
          # سود: یک لینک برای همه، صفر پیامِ «نصب نشد»، و صفر سؤالِ
          # «کدام فایل را به کاربر بدهم؟».
          #
          # services.gradle.org گاهی وسط دانلود distribution قطع می‌شود
          # (SocketException: Unexpected end of file). تست و آنالیز سبز
          # می‌مانند و فقط همین مرحله می‌ترکد. چند بار تلاش + پیش‌دانلود
          # با curl --retry همان فایل را پایدارتر می‌گیرد.
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$WRAPPER" ]; then
            DIST=$(sed -n 's/^distributionUrl=//p' "$WRAPPER" | sed 's#\\:#:#g')
            if [ -n "$DIST" ]; then
              echo "prefetch $DIST"
              mkdir -p "$HOME/.gradle/wrapper/dists"
              curl -fL --retry 6 --retry-all-errors --retry-delay 8 -o /tmp/gradle-dist.zip "$DIST" \
                || echo "prefetch failed; flutter build will retry the wrapper download"
            fi
          fi
          # ═══════════════════════════════════════════════════════════════
          # چرا file-watcher گِرِیدل خاموش می‌شود
          # ═══════════════════════════════════════════════════════════════
          #
          # لاگِ بیلد این را می‌داد:
          #
          #     Caught exception: Already watching path:
          #     /home/runner/work/GhelGheli/GhelGheli/mobile/android
          #
          # حلقهٔ retry (۴ تلاش) می‌تواند گِرِیدل را چند بار پشتِ سرِ هم
          # اجرا کند. دیمنِ گِرِیدل بینِ این اجراها زنده می‌ماند و تلاش
          # می‌کند همان مسیر را دوباره watch کند — که استثنا می‌دهد.
          #
          # روی CI هر بیلد از صفر است و watcher هیچ سودی ندارد (کارش
          # تشخیصِ تغییرِ فایل بینِ بیلدهای متوالیِ محلی است). خاموش
          # کردنش هم استثنا را حذف می‌کند هم چند ثانیه صرفه‌جویی است.
          #
          # `--no-daemon` هم اضافه شد: دیمنِ ماندگار روی رانرِ یک‌بارمصرف
          # فقط حافظه می‌گیرد و همین حالتِ «قبلاً watch شده» را می‌سازد.
          mkdir -p android
          {
            echo "org.gradle.vfs.watch=false"
            echo "org.gradle.daemon=false"
          } >> android/gradle.properties
          APP_RELEASE=$(awk '/^version:/{print $2}' pubspec.yaml)
          ok=0
          for attempt in 1 2 3 4; do
            echo "── flutter build attempt $attempt ──"
            # ⚠️ پیش‌فرضِ `PUBLIC_WEB_URL` باید همان آدرسی باشد که واقعاً
            #    جواب می‌دهد: `ghelghelishop.ir` بدونِ زیردامنه از بیرون
            #    پاسخ نمی‌دهد (بررسیِ زنده: کدِ ۰۰۰)، پس هر نسخه‌ای که با آن
            #    ساخته شود لینکِ دعوتِ مرده پخش می‌کند. این مقدار باید با
            #    `share_invite.dart` و بک‌اند یکی بماند؛ گاردِ
            #    `testDomainPortability.js` همین را می‌سنجد.
            #
            # ═══════════════════════════════════════════════════════════════
            # 🔴 کامنت **داخلِ** این دستور نگذار
            # ═══════════════════════════════════════════════════════════════
            # نسخهٔ اولِ همین توضیح، وسطِ دستورِ `flutter build apk` (بینِ
            # خطوطِ ادامه‌دارِ `\`) نوشته شده بود. نتیجه: شل، خطِ کامنت را
            # به خطِ قبلی چسباند و کامنت، **بقیهٔ دستور را خورد**؛ خطِ بعدی
            # به‌عنوان یک فرمانِ تازه اجرا شد
            # (`--dart-define=…: No such file or directory`) و مرحله با
            # شکست تمام شد — با اینکه APK ساخته شده بود. دو تعریفِ آخر
            # (`PUBLIC_WEB_URL` و `APP_RELEASE`) هم بی‌سروصدا از بیلد
            # افتادند. گاردِ `testDomainPortability.js` حالا نبودِ کامنت
            # داخلِ این دستور را می‌سنجد.
            if flutter build apk --release \
              --target-platform=android-arm,android-arm64 \
              --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.ghelghelishop.com' }} \
              --dart-define=PUBLIC_WEB_URL=${{ vars.PUBLIC_WEB_URL || 'https://user.ghelghelishop.com' }} \
              --dart-define=APP_RELEASE="$APP_RELEASE"; then
              ok=1
              break
            fi
            # بینِ تلاش‌ها دیمن را کاملاً بکش تا حالتِ نیمه‌مردهٔ watcher
            # به تلاشِ بعدی ارث نرسد.
            (cd android && ./gradlew --stop >/dev/null 2>&1) || true
            sleep $((attempt * 20))
          done
          [ "$ok" = 1 ] || { echo "::error::flutter build apk after 4 attempts failed"; exit 1; }
          echo "── خروجی‌ها ──"
          ls -lh build/app/outputs/flutter-apk/*.apk

      # ── سنجشِ خودِ فایلِ خروجی ─────────────────────────────────────────
      # بیلدِ تازهٔ یونیورسال ۹۰ مگابایت درآمد و ~۴ مگابایت معماریِ شبیه‌ساز
      # (x86_64) هم داخلش بود — چیزی که هیچ خطِ لاگی نشانش نمی‌داد و باید
      # خودِ فایل باز می‌شد تا دیده شود. این استپ همان کار را خودکار می‌کند.
      - name: Sanity check the universal APK
        run: |
          APK=mobile/build/app/outputs/flutter-apk/app-release.apk
          [ -f "$APK" ] || { echo "::error::خروجیِ universal ساخته نشد: $APK"; ls -l mobile/build/app/outputs/flutter-apk/ || true; exit 1; }
          LIBS=$(unzip -l "$APK" | awk '/lib\// {split($4,a,"/"); print a[2]}' | sort -u)
          echo "معماری‌های داخلِ APK:"; echo "$LIBS"
          echo "$LIBS" | grep -q '^arm64-v8a$' || { echo "::error::arm64-v8a داخلِ APK نیست — کاربرانِ ۶۴بیتی نصب نمی‌کنند"; exit 1; }
          echo "$LIBS" | grep -q '^armeabi-v7a$' || { echo "::error::armeabi-v7a داخلِ APK نیست — گوشی‌های ۳۲بیتی نصب نمی‌کنند"; exit 1; }
          BAD=$(echo "$LIBS" | grep -vE '^(arm64-v8a|armeabi-v7a)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::معماریِ اضافه در APKِ یونیورسال: $BAD (فقط شبیه‌ساز است و حجمِ کاربر را بالا می‌برد)"
            exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          echo "حجم: $((SIZE / 1048576)) مگابایت"
          if [ "$SIZE" -gt 110000000 ]; then
            echo "::error::حجمِ APK غیرمنتظره بزرگ است ($((SIZE / 1048576)) مگابایت) — وابستگیِ ناخواسته اضافه شده؟"
            exit 1
          fi
          echo "✓ APKِ یونیورسال سالم است: هر دو معماریِ arm، بدونِ معماریِ اضافه"

      # Prove the output is signed with OUR key before anyone uploads it.
      # A debug-signed APK is indistinguishable from a release one until
      # Cafe Bazaar rejects it, so the check belongs here.
      - name: Verify APK signature
        run: |
          cd mobile
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          # حلقه روی همهٔ `*-release.apk`ها می‌چرخد (امروز یکی است، ولی
          # اگر روزی حالتِ split برگشت، خودکار پوشش داده می‌شود). حلقه نزدن
          # یعنی ممکن است یکی از آن‌ها دیباگ‌ساین باشد و کسی متوجه نشود.
          shopt -s nullglob
          FOUND=0
          for APK in build/app/outputs/flutter-apk/*-release.apk; do
            FOUND=1
            echo "── $APK ──"
            "$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certs.txt
            if grep -qi "CN=Android Debug" /tmp/certs.txt; then
              echo "::error::$APK با کلید دیباگ امضا شده — نه قابل انتشار"
              echo "است و نه قابل به‌روزرسانی."
              exit 1
            fi
            grep -q "CN=GhelGheli" /tmp/certs.txt \
              || { echo "::error::گواهی امضای غیرمنتظره در $APK"; exit 1; }
          done
          [ "$FOUND" = "1" ] || { echo "::error::هیچ APKی تولید نشد"; exit 1; }
          echo "همهٔ APKها با کلید ریلیز GhelGheli امضا شده‌اند"

      # The signing material must not survive the job, even on a failure.
      - name: Scrub signing material
        if: always()
        run: rm -f mobile/android/app/release.jks mobile/android/key.properties mobile/android/app/google-services.json

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apks
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
