# ⚠️ ورک‌فلوی موقّت — فقط برای بیرون‌کشیدنِ «کلیدِ امضای اپ» از سکرتِ گیت‌هاب.
#
# چرا لازم است: کلیدِ امضا فقط داخل سکرتِ `ANDROID_KEYSTORE_BASE64` زندگی
# می‌کند و سکرت‌های گیت‌هاب **فقط خواندنی-برای-اکشن** هستند؛ از بیرون
# (API) هیچ راهی برای دیدنشان نیست. مالک هم صریح خواست نسخهٔ پشتیبانِ کلید
# را بگیرد، چون اگر این سکرت روزی گم شود، **دیگر هرگز نمی‌توان نسخهٔ به‌روزِ
# اپ را منتشر کرد** (اندروید اپی با امضای متفاوت را روی نسخهٔ قبلی نصب
# نمی‌کند و کاربر باید اپ را حذف و از نو نصب کند).
#
# این ورک‌فلو کلید را رمزگشایی می‌کند، یک بار با `keytool` صحتش را تأیید
# می‌کند، و همراهِ رمزها و راهنما به‌صورت Artifact (نگه‌داری: ۱ روز) بالا
# می‌گذارد. پس از تحویل به تلگرام، هم Artifact حذف می‌شود و هم این فایل.
#
# امنیت: اجرا فقط دستی و با عبارتِ تأییدِ اجباری. هیچ trigger خودکاری ندارد.

name: Keystore Export (temporary)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'برای اجرا دقیقاً بنویس: EXPORT-KEYSTORE'
        required: true
        default: ''

jobs:
  export:
    if: ${{ github.event.inputs.confirm == 'EXPORT-KEYSTORE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: بازسازیِ کی‌استور از سکرت + ساختِ بستهٔ تحویل
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::سکرتِ کی‌استور خالی است"; exit 1; fi
          if [ -z "$STORE_PASS" ]; then echo "::error::رمزِ کی‌استور خالی است"; exit 1; fi
          mkdir -p out
          printf '%s' "$KEYSTORE_B64" | base64 -d > out/release.jks

          # تأییدِ اینکه فایل واقعاً کی‌استور است و اثرِ انگشتِ گواهی چیست.
          keytool -list -v -keystore out/release.jks -storepass "$STORE_PASS" \
            > out/keytool-list.txt 2>&1 || { echo "::error::کی‌استور با این رمز باز نشد"; cat out/keytool-list.txt; exit 1; }
          grep -E "Alias name|Owner|Valid from|SHA1:|SHA256:" out/keytool-list.txt | head -12

          shasum -a 256 out/release.jks | awk '{print $1}' > out/release.jks.sha256
          ls -l out/release.jks

          cat > out/credentials.txt <<EOF
          # اعتبارنامه‌های امضای اپ قلقلی — محرمانه
          # این‌ها همان مقادیری هستند که در سکرت‌های گیت‌هاب ذخیره شده‌اند.
          storePassword=$STORE_PASS
          keyPassword=$STORE_PASS
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

          cat > out/README-fa.txt <<'EOF'
          کلیدِ امضای اپ قلقلی (release.jks) — نسخهٔ پشتیبان
          ==================================================

          این فایل چیست؟
            کلیدی است که اپ اندروید با آن «امضا» می‌شود. اندروید اجازه نمی‌دهد
            نسخهٔ تازهٔ یک اپ با کلیدِ متفاوت روی نسخهٔ قبلی نصب شود. پس اگر
            این کلید گم شود، دیگر نمی‌توان برای کاربرانِ فعلی به‌روزرسانی منتشر
            کرد؛ تنها راه، انتشار یک اپ با نام/شناسهٔ تازه و از دست دادنِ
            کاربرانِ قبلی است.

          چه چیزی داخلِ این بسته است؟
            release.jks           خودِ کلید (فایلِ کیفِ کلید جاوا)
            credentials.txt       رمزِ کلید و نامِ مستعار (alias)
            keytool-list.txt      گزارشِ تأییدِ کلید (اثر انگشتِ گواهی)
            release.jks.sha256    هشِ فایل برای بررسیِ سلامتِ کپی

          این بسته را کجا نگه دارم؟
            ۱. یک نسخهٔ آفلاین (فلش/دیسکِ بیرونی یا رمزنگاری‌شده).
            ۲. نسخهٔ دوم در جایی جدا از گیت‌هاب (مثلاً همین تلگرام).
            ⚠️ بعد از ذخیره شدن، این پیام را از تلگرام حذف کنید.

          اگر GitHub از دست رفت، چطور اپ را دوباره منتشر کنم؟
            در مخزن → Settings → Secrets and variables → Actions، سه سکرت بسازید:
              ANDROID_KEYSTORE_BASE64   = خروجیِ:  base64 -w0 release.jks
              ANDROID_KEYSTORE_PASSWORD = مقدارِ storePassword در credentials.txt
              ANDROID_KEY_ALIAS         = مقدارِ keyAlias در credentials.txt
            بعد ورک‌فلوی «Build APK» را دستی اجرا کنید.

          اثر انگشتِ گواهی (بررسیِ درستیِ نسخه)
          -------------------------------------
          در keytool-list.txt بگردید و با نسخه‌ای که قبلاً ثبت کرده‌اید مقایسه کنید.
          اگر یکی بود، یعنی کلید سالم است.
          EOF

          tar czf out/keystore-backup.tar.gz -C out release.jks credentials.txt keytool-list.txt release.jks.sha256 README-fa.txt

      - name: بارگذاریِ بسته (۱ روز نگه‌داری)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: out/
          retention-days: 1
          if-no-files-found: error
