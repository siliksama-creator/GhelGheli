  <!-- هیچ rect پس‌زمینه‌ای نیست: بیرون از حلقه کاملاً شفاف است -->
  <!--
    سایه روی دیسکِ زیرین است نه روی گروه برش‌ها. چون برش‌ها دورِ یک سوراخ
    چیده شده‌اند، feDropShadow روی آن‌ها سایه را به *داخل* سوراخ هم
    می‌انداخت و حفرهٔ مرکزی را تیره نگه می‌داشت — هرقدر هم که خود برش‌ها
    روشن می‌شدند. اینجا سایه از یک دایرهٔ توپرِ نامرئی می‌آید که سوراخ
    ندارد، پس فقط بیرون می‌افتد.
  -->
  <path d="M 500.0 500.0 m -492,0 a 492,492 0 1,0 984,0 a 492,492 0 1,0 -984,0 M 500.0 500.0 m -150,0 a 150,150 0 1,1 300,0 a 150,150 0 1,1 -300,0 Z" fill-rule="evenodd" fill="#0B1220"
        fill-opacity="0.5" filter="url(#soft)"/>
  <g>
    <path d="M 500.00 32.00 A 468 468 0 0 1 734.00 94.70 L 575.00 370.10 A 150 150 0 0 0 500.00 350.00 Z" fill="url(#g0)" stroke="#0B1220"
