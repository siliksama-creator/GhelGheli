<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"
     width="1000" height="1000" fill="none">
  <title>گردونهٔ شانس قلقلی</title>
  <defs>
    <radialGradient id="g0" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#3F6212"/>
    </radialGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#155E75"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </radialGradient>
    <radialGradient id="g4" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#3F6212"/>
    </radialGradient>
    <radialGradient id="g5" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <radialGradient id="g6" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#155E75"/>
    </radialGradient>
    <radialGradient id="g7" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>
    <radialGradient id="g8" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FDE68A"/>
      <stop offset="35%"  stop-color="#F59E0B"/>
      <stop offset="65%"  stop-color="#B45309"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#BEF264" stop-opacity="0.30"/>
      <stop offset="70%"  stop-color="#84CC16" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hubRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FDE68A"/>
      <stop offset="50%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <!-- درخشش ملایم روی نیمهٔ بالا: گردونه را از یک دایرهٔ تخت جدا می‌کند -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000"
                    flood-opacity="0.35"/>
    </filter>
    <filter id="txtShadow" x="-40%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#000"
                    flood-opacity="0.62"/>
    </filter>
  </defs>

  <!-- هیچ rect پس‌زمینه‌ای نیست: بیرون از حلقه کاملاً شفاف است -->
  <!--
    سایه روی دیسکِ زیرین است نه روی گروه برش‌ها. چون برش‌ها دورِ یک سوراخ
    چیده شده‌اند، feDropShadow روی آن‌ها سایه را به *داخل* سوراخ هم
    می‌انداخت و حفرهٔ مرکزی را تیره نگه می‌داشت — هرقدر هم که خود برش‌ها
    روشن می‌شدند. اینجا سایه از یک دایرهٔ توپرِ نامرئی می‌آید که سوراخ
    ندارد، پس فقط بیرون می‌افتد.
  -->
  <path d="M 500.0 500.0 m -492,0 a 492,492 0 1,0 984,0 a 492,492 0 1,0 -984,0 M 500.0 500.0 m -150,0 a 150,150 0 1,1 300,0 a 150,150 0 1,1 -300,0 Z" fill-rule="evenodd" fill="#0B1220"
        fill-opacity="0.5" filter="url(#soft)"/>
  <g>
    <path d="M 500.00 32.00 A 468 468 0 0 1 800.82 141.49 L 596.42 385.09 A 150 150 0 0 0 500.00 350.00 Z" fill="url(#g0)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
    <path d="M 800.82 141.49 A 468 468 0 0 1 960.89 418.73 L 647.72 473.95 A 150 150 0 0 0 596.42 385.09 Z" fill="url(#g1)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
    <path d="M 960.89 418.73 A 468 468 0 0 1 905.30 734.00 L 629.90 575.00 A 150 150 0 0 0 647.72 473.95 Z" fill="url(#g2)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
    <path d="M 905.30 734.00 A 468 468 0 0 1 660.07 939.78 L 551.30 640.95 A 150 150 0 0 0 629.90 575.00 Z" fill="url(#g3)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
    <path d="M 660.07 939.78 A 468 468 0 0 1 339.93 939.78 L 448.70 640.95 A 150 150 0 0 0 551.30 640.95 Z" fill="url(#g4)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
    <path d="M 339.93 939.78 A 468 468 0 0 1 94.70 734.00 L 370.10 575.00 A 150 150 0 0 0 448.70 640.95 Z" fill="url(#g5)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
    <path d="M 94.70 734.00 A 468 468 0 0 1 39.11 418.73 L 352.28 473.95 A 150 150 0 0 0 370.10 575.00 Z" fill="url(#g6)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
    <path d="M 39.11 418.73 A 468 468 0 0 1 199.18 141.49 L 403.58 385.09 A 150 150 0 0 0 352.28 473.95 Z" fill="url(#g7)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
    <path d="M 199.18 141.49 A 468 468 0 0 1 500.00 32.00 L 500.00 350.00 A 150 150 0 0 0 403.58 385.09 Z" fill="url(#g8)" stroke="#0B1220"
          stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- درخشش، فقط روی حلقه — نه روی سوراخ مرکزی -->
  <path d="M 500.0 500.0 m -468,0 a 468,468 0 1,0 936,0 a 468,468 0 1,0 -936,0 M 500.0 500.0 m -150,0 a 150,150 0 1,1 300,0 a 150,150 0 1,1 -300,0 Z" fill="url(#sheen)" fill-rule="evenodd"
        style="pointer-events:none"/>

  <!-- حلقهٔ طلایی بیرونی -->
  <circle cx="500.0" cy="500.0" r="480.0"
          fill="none" stroke="url(#rim)" stroke-width="24"/>
  <circle cx="500.0" cy="500.0" r="492" fill="none"
          stroke="#0B1220" stroke-width="4" stroke-opacity="0.55"/>
  <circle cx="500.0" cy="500.0" r="468" fill="none"
          stroke="#0B1220" stroke-width="4" stroke-opacity="0.55"/>
  <g>
    <circle cx="583.4" cy="27.3" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="740.0" cy="84.3" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="867.7" cy="191.5" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="951.1" cy="335.8" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="980.0" cy="500.0" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="951.1" cy="664.2" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="867.7" cy="808.5" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="740.0" cy="915.7" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="583.4" cy="972.7" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="416.6" cy="972.7" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="260.0" cy="915.7" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="132.3" cy="808.5" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="48.9" cy="664.2" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="20.0" cy="500.0" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="48.9" cy="335.8" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="132.3" cy="191.5" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="260.0" cy="84.3" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="416.6" cy="27.3" r="7" fill="#FFFBEB" stroke="#92400E" stroke-width="1.5"/>
  </g>
  <g font-family="Vazirmatn, Tahoma, sans-serif" filter="url(#txtShadow)">
    <g transform="rotate(20.0 620.4 169.2)">
      <text x="620.4" y="153.2" font-size="56" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۱۰۰</text>
      <text x="620.4" y="195.2" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">امتیاز</text>
    </g>
    <g transform="rotate(60.0 804.8 324.0)">
      <text x="804.8" y="308.0" font-size="48" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۵۰٬۰۰۰</text>
      <text x="804.8" y="350.0" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">تومان</text>
    </g>
    <g transform="rotate(280.0 846.7 561.1)">
      <text x="846.7" y="545.1" font-size="56" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۱۰۰۰</text>
      <text x="846.7" y="587.1" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">امتیاز</text>
    </g>
    <g transform="rotate(320.0 726.3 769.6)">
      <text x="726.3" y="753.6" font-size="48" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۱۰٬۰۰۰</text>
      <text x="726.3" y="795.6" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">تومان</text>
    </g>
    <g transform="rotate(360.0 500.0 852.0)">
      <text x="500.0" y="836.0" font-size="56" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۱۰۰</text>
      <text x="500.0" y="878.0" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">امتیاز</text>
    </g>
    <g transform="rotate(400.0 273.7 769.6)">
      <text x="273.7" y="753.6" font-size="56" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۵۰۰۰</text>
      <text x="273.7" y="795.6" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">امتیاز</text>
    </g>
    <g transform="rotate(440.0 153.3 561.1)">
      <text x="153.3" y="545.1" font-size="56" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۱۰۰۰</text>
      <text x="153.3" y="587.1" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">امتیاز</text>
    </g>
    <g transform="rotate(300.0 195.2 324.0)">
      <text x="195.2" y="308.0" font-size="56" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۲۰۰۰</text>
      <text x="195.2" y="350.0" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">امتیاز</text>
    </g>
    <g transform="rotate(340.0 379.6 169.2)">
      <text x="379.6" y="153.2" font-size="42" font-weight="900"
            fill="#FFFFFF" text-anchor="middle" dominant-baseline="central"
            direction="rtl">۱۰۰٬۰۰۰</text>
      <text x="379.6" y="195.2" font-size="30" font-weight="700"
            fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle"
            dominant-baseline="central" direction="rtl">تومان</text>
    </g>
  </g>
  <!-- حلقهٔ مرکزی.

       اینجا هیچ دیسک توپری نیست. نسخهٔ اول یک دایرهٔ #0B1220 با شفافیت ۹۲٪
       داشت و سر شخصیت را می‌بلعید؛ با نمونه‌برداری از آلفای رندرشده معلوم
       شد مرکز rgba(11,18,31,235) است یعنی عملاً مات. حالا فقط یک هالهٔ
       ملایم و یک رینگ طلایی است، پس وسط گردونه واقعاً شفاف می‌ماند و
       شخصیت روی پس‌زمینهٔ خودِ صفحه می‌نشیند. -->
  <circle cx="500.0" cy="500.0" r="158" fill="url(#hubGlow)"/>
  <circle cx="500.0" cy="500.0" r="158" fill="none"
          stroke="url(#hubRing)" stroke-width="13"/>
  <circle cx="500.0" cy="500.0" r="150.5" fill="none"
          stroke="#0B1220" stroke-width="2.5" stroke-opacity="0.45"/>
</svg>
