<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06101d" />
    <meta name="description" content="قلقلی — باشگاه کارت‌های فوتبالی: امتیاز جمع کن، جایزه بگیر و با دوستانت بازی کن." />
    <title>قلقلی - ورود و ثبت‌نام</title>
    <link rel="icon" href="/favicon.png" />
    <!--
      Preload only the two weights that are on screen before any interaction
      (body text + headings). Without this the first paint used the OS
      fallback and every line visibly reflowed a moment later.
      Preloading all five instead wasted ~100KB the user never sees.
    -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Vazirmatn-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The API lives on another subdomain; warming the connection removes a
         DNS + TLS round trip from the very first request after login. -->
    <link rel="preconnect" href="https://api.ghelghelishop.com" crossorigin />
    <!--
      قهرمانِ صفحهٔ بارگذاری.

      مرحلهٔ `art` در دروازهٔ راه‌اندازی تا رمزگشاییِ **همین** تصویر باز
      نمی‌شود، چون تنها تصویری است که کاربر در آن صفحه می‌بیند. بدونِ این
      خط، درخواستِ تصویر تا وقتی ری‌اکت مانت شود (روی یک اتصالِ ایرانیِ کند
      حدود یک ثانیه) اصلاً زده نمی‌شود — یعنی دانلودش **بعد از** باندلِ
      جاوااسکریپت شروع می‌شد، در حالی که می‌تواند موازیِ آن باشد.

      همین یک خط، روی یک اتصالِ ضعیف چند صد میلی‌ثانیه از انتظارِ کاربر
      کم می‌کند و هیچ هزینه‌ای ندارد: این تصویر به‌هرحال در هر دو حالت
      (وارد‌شده و مهمان) در صفحهٔ بارگذاری و بعد در هدرِ صفحهٔ ورود دیده
      می‌شود.
    -->
    <link rel="preload" href="/logo.webp" as="image" type="image/webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
