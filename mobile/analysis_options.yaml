# پیکربندی تحلیلگر ایستا.
#
# ═══════════════════════════════════════════════════════════════════════════
# چرا از پیش‌فرضِ flutter_lints فراتر رفتیم
# ═══════════════════════════════════════════════════════════════════════════
#
# مجموعهٔ پیش‌فرض عمداً محافظه‌کار است تا پروژه‌های تازه را غرقِ هشدار
# نکند. نتیجه‌اش این است که چند دسته از **باگ‌های واقعیِ زمانِ اجرا** را
# اصلاً نمی‌بیند — دقیقاً همان دسته‌هایی که در این اپ قبلاً کرش ساخته‌اند:
#
#   • `use_build_context_synchronously` — استفاده از context بعد از یک
#     await. این ریشهٔ کلاسیکِ «Looking up a deactivated widget's ancestor
#     is unsafe» است که یک بار در این پروژه دیده شد.
#   • `unawaited_futures` — یک Future رهاشده یعنی خطایش هرگز گرفته نمی‌شود
#     و به‌صورت unhandled exception در لاگ گم می‌شود. باگِ تاریخیِ
#     `ApiClient.get()` که هرگز settle نمی‌شد از همین خانواده بود.
#   • `close_sinks` / `cancel_subscriptions` — نشتِ حافظه‌ای که فقط بعد از
#     چند دقیقه استفاده خودش را نشان می‌دهد، پس در تستِ دستی هرگز دیده
#     نمی‌شود.
#
# هر قانونی که اینجا روشن شده، دست‌کم یک باگِ واقعی در این مخزن را
# می‌گرفت یا می‌گیرد. قانونی که فقط سلیقه است (مثل ترتیب import) عمداً
# روشن نشده تا سیگنال در نویز گم نشود.
include: package:flutter_lints/flutter.yaml

analyzer:
  # هشدارهای زیر به خطا ارتقا می‌یابند: هر کدام یک باگِ زمانِ اجراست،
  # نه یک نکتهٔ سبکی. ارتقا به خطا یعنی CI جلویشان را می‌گیرد.
  errors:
    # context بعد از await — کرشِ «deactivated widget».
    use_build_context_synchronously: error
    # Future رهاشده — خطای بلعیده‌شده.
    unawaited_futures: error
    # منابعی که بسته نمی‌شوند — نشتِ حافظه.
    close_sinks: error
    cancel_subscriptions: error
    # کدِ مرده و importهای بی‌مصرف: هزینهٔ بیلد و سردرگمیِ خواننده.
    unused_import: error
    unused_local_variable: error
    unused_field: error
    dead_code: error
    # APIهای منسوخ: مهاجرتِ بعدیِ فلاتر را می‌شکنند.
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # ── درستی و ایمنی (هر کدام یک کلاسِ باگِ واقعی) ──
    always_use_package_imports: false      # importهای نسبی در این پروژه رایج‌اند
    avoid_empty_else: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    control_flow_in_finally: true
    empty_statements: true
    no_duplicate_case_values: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_statements: true
    use_build_context_synchronously: true
    valid_regexps: true

    # ── عملکرد (مستقیماً به فازهای ۳ و ۴ مربوط‌اند) ──
    avoid_unnecessary_containers: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true

    # ── خوانایی، فقط جایی که به درستی کمک می‌کند ──
    avoid_returning_null_for_void: true
    prefer_final_locals: false   # پرسروصدا و بدون سود ایمنی
    prefer_is_empty: true
    prefer_is_not_empty: true
