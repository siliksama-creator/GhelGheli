<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150"
     width="120" height="150" fill="none">
  <title>سوزن گردونه</title>
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FDE68A"/>
      <stop offset="45%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="ps" x="-50%" y="-30%" width="200%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000"
                    flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- نوک رو به پایین: روی لبهٔ بالای گردونه می‌نشیند و به داخل اشاره
       می‌کند، پس برشِ برنده همانی است که زیر نوک است. -->
  <g filter="url(#ps)">
    <path d="M 60 132 L 18 44 A 46 46 0 1 1 102 44 Z"
          fill="url(#pin)" stroke="#7C2D12" stroke-width="4"
          stroke-linejoin="round"/>
    <circle cx="60" cy="44" r="17" fill="#FFFBEB" stroke="#7C2D12"
            stroke-width="4"/>
  </g>
</svg>
