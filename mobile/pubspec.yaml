name: ghelgheli_mobile
description: اپلیکیشن فارسی وفاداری کارت‌های فوتبالی قلقلی
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  socket_io_client: ^2.0.3+1
  shamsi_date: ^1.0.2
  intl: ^0.20.2
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  # Used to sign tap-game batches (HMAC-SHA256). Already present transitively
  # via firebase/shared_preferences; declared explicitly because we import it
  # directly and an implicit dependency can vanish on any upstream bump.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# ساخت APK از ۲۶ جولای ۲۰۲۶ روی هر شاخه‌ای (از جمله main) می‌شکست با:
#
#   A problem occurred evaluating project ':jni'.
#   > Could not find method kotlin() ... on project ':jni'
#
# علت: نسخهٔ 2.3.0 بستهٔ path_provider_android (منتشرشده ۶ آوریل ۲۰۲۶)
# وابستگی تازه‌ای به بستهٔ `jni` اضافه کرد. فایل Gradle آن بسته `kotlin()`
# را صدا می‌زند که به افزونهٔ Kotlin Gradle نیاز دارد — و پروژهٔ اندرویدی
# که `flutter create` اینجا می‌سازد آن افزونه را ندارد.
#
# نکتهٔ مهم: pubspec.lock نسخهٔ ۲.۲.۲۳ (سالم) را پین کرده بود، ولی مرحلهٔ
# `flutter create --platforms=android .` در CI وابستگی‌ها را دوباره حل
# می‌کند و به ۲.۳.۱ ارتقا می‌داد؛ برای همین قفل به‌تنهایی جلوی خرابی را
# نمی‌گرفت. dependency_overrides در هر بار حل وابستگی اعمال می‌شود.
#
# path_provider مستقیماً در کد استفاده نمی‌شود؛ به‌صورت غیرمستقیم از
# مسیر shared_preferences / image_picker می‌آید. وقتی `jni` با Gradle
# پروژه سازگار شد، این قید را بردارید.
dependency_overrides:
  path_provider_android: 2.2.23

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 23

# LAUNCH SPLASH.
#
# Three real defects were fixed here; keep the comments, they are the reason
# each line looks the way it does.
#
# 1. ANDROID 12+ CROPS THE SPLASH ICON TO A CIRCLE. Since Android 12 the boot
#    screen is drawn by the SYSTEM: it fits `android_12.image` into a 240dp
#    circle and reveals only the inner 160dp. We were handing it the same
#    full-length standing character used for the legacy splash, so the head
#    and feet fell outside the circle and the boot screen showed a slice of
#    torso. `android_12` now gets its own square, face-centred, padded image.
#
# 2. NO DARK-MODE ENTRY. Without `color_dark`/`image_dark`, a device in dark
#    mode fell back to the platform default — a white flash before the app's
#    dark theme painted. Both modes are declared, with the same near-black
#    the app itself opens on, so there is no flash in either.
#
# 3. `fullscreen: true` HID THE STATUS BAR for the splash only. The app then
#    restores it a frame later, so the whole UI visibly jumped down at
#    startup. The splash now keeps the normal system bars, and the transition
#    into the app is seamless.
flutter_native_splash:
  # Matches BrandColors' dark canvas, so the splash and the first frame of
  # the app are literally the same colour.
  color: "#060D18"
  image: assets/splash/splash_logo.png
  color_dark: "#060D18"
  image_dark: assets/splash/splash_logo.png

  android_12:
    color: "#060D18"
    color_dark: "#060D18"
    # Square, face-centred crop with its own padding: this one goes inside
    # the system's circular mask.
    image: assets/splash/splash_android12.png
    image_dark: assets/splash/splash_android12.png
    # The circle behind the icon. Same colour as the page, so the mask is
    # invisible instead of reading as a grey coin behind the character.
    icon_background_color: "#060D18"
    icon_background_color_dark: "#060D18"

  android: true
  ios: false
  # See note 3 above: hiding the bars here made the app jump on launch.
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/games/
    - assets/games/memory/
    - assets/games/tap/
    - assets/shop/
    - assets/sfx/
    - assets/avatars/
    - assets/wheel/
    - assets/pass/
    # NOT bundled, deliberately:
    #
    #   assets/icon/  — 1.7 MB of source art (icon, background, foreground,
    #     monochrome, all 1024x1024) consumed by flutter_launcher_icons at
    #     BUILD time. It generates the real mipmaps into android/res; nothing
    #     in lib/ ever calls Image.asset on these, so listing them here only
    #     shipped a second copy inside the APK for no one to read.
    #
    #   assets/splash/splash_logo.png — same story for
    #     flutter_native_splash (528 KB).
    #
    # splash_android12.png IS still needed at runtime: splash_screen.dart
    # draws it so the Flutter first frame matches the native splash exactly.
    # It is listed as a single file rather than re-including the folder.
    - assets/splash/splash_android12.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
